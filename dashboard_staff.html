body{
    margin: 0;
    height: 100vh;
    width: 100vw;
    display: flex;
    overflow-x: hidden;
    overflow-y: hidden;
}
aside{
    width: 236px;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-top-right-radius: 20px;
    border-bottom-right-radius: 20px;
    background-color: #FDC5E1;
}
.icon-left, .icon-right, .icon-pink {
    position: absolute;
  }

.icon-left {
    top: 200px;
    right: 50px;
    width: 452px;
    z-index: -1;
    rotate: 190deg;
}
  
.icon-right {
    position: absolute;
    bottom: -100px;
    right: 0;
    width: 420px;
    z-index: -2; /* di bawah pink */
    opacity: 75%;
  }
  
.icon-pink {
    position: absolute;
    top: 40px;   /* naikkan sedikit */
    right: 0;    /* geser kiri */
    width: 260px;    /* sedikit lebih kecil dari ungu */
    z-index: -2;     /* lebih tinggi dari icon ungu */
    opacity: 75%;
    rotate: 10deg;
}

.icon-left img,
.icon-right img,
.icon-pink img {
  width: 100%;
  height: auto;
}
.dash{
    width: 1440px;

}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
}

body {
    background-color: #fff;
}

.container {
    display: flex;
    height: 100vh;
}


.profile {
    width: 236px;
    height: 62px;
    display: flex;
    align-content: center;
    justify-content: center;
    border-bottom: 2px solid #A2A2A2;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-left : 23.5px;
    margin-top: 6.5px;
    margin-bottom: 6.5px;
    display: flex;
    justify-content: center;
    align-self: center;
}

.username {
    font-weight: 600;
    text-align: center;
    padding: 17.5px 23.5px 17.5px 15px;
    font-family: Plus Jakarta Sans, sans-serif;
    font-size: 16px;
    align-self: center;
}

.nav-links {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 20px;
    width: 236px;
    height: 204px;
}

.nav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    color: #0306A0;
    text-decoration: none;
    width : 186px;
    height: 36px;
    

}
.nav:hover {
    background-color: #A2A2A280;
    border-radius: 8px;
  }
nav a{
    font-family: Plus Jakarta Sans, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #0306A0;
    margin-left: 12px;
}
nav svg{
    width: 30px;
    height: 30px;
    padding-left: 4px;
}
.nav.active {
    background-color: #eab4d3;
    font-weight: 600;
}

.logout {
    margin-top: 295px;
    width: 94px;
    height: 44px;
    background-color: #8a0a47;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    margin : 295px 71px 42px 71px;
    justify-content: center;
    align-items: center;
}

.main-content {
    flex: 1;
    background-image: url('background-wave.png'); /* bisa kamu sesuaikan */
    background-repeat: no-repeat;
    background-position: right bottom;
    background-size: contain;
}

.greeting {
    font-size: 38px;
    margin-bottom: 30px;
    color: #4043E9;
    font-family: Plus Jakarta Sans, sans-serif;
    font-weight: 700;
    margin-left: 58px;
    margin-top: 44px;


}
.greeting span {
    color: #E9509D;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 414px);
    grid-template-rows: repeat(2, 184px);
    gap: 24px;
    margin-left: 58px;
}

.card {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
}
.card p{
    font-family: Plus Jakarta Sans, sans-serif;
    font-size: 22px;
    font-weight: 700;
    display: flex;
    margin-top: 27px;
    margin-left: 15px;
    
}
.card-header {
    height: 44px;
    background-color: #4a4a4a;
}

.card-content {
    display: flex;
    justify-content: space-between;
    color: black;
    font-weight: 600;
}

.card.green { background-color: #4af3c0; }
.card.pink { background-color: #f272b7; }
.card.blue { background-color: #7f7fff; }

.card svg {
    height: auto;
}
