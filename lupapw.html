<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="lupapw.css">
</head>
<body>
    <div class="icon-left">
        <img src="assets/icon_hijau.png" alt="Icon Hijau">
      </div>
      <div class="icon-right">
        <img src="assets/icon_ungu.png" alt="Icon Ungu">
      </div>
      <div class="icon-pink">
        <img src="assets/icon_pink.png" alt="Icon Pink">
      </div>

    <div class="main">
        <div class="forgot-pass">
            <h1 class="titles">
                <span class="pink text">Lupa </span>
                <span class="green text">Passwordmu?</span>
            </h1>
            <div class="email"> 
                <p class="auth-kinds">Email</p>                    
                <input type="email" class="fill-here" placeholder="email@email.com">
            </div>

            <div class="kirim-email">
                <div class="send-email"> Kirim Email </div>
                <span class="sudah-blom">Sudah reset password? <a href="/login.html">Login</a></span>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
