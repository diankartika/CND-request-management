<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign Up </title>
    <link rel="stylesheet" href="daftar.css">
</head>
<body>
    <div class="auth-box">
        <div class="auth-main">
            <p> 
                <span class="pink text"> Yuk </span>
                <span class="green text"> Mulai </span>
                <span class="darkblue text"> Kelola </span>
                <span class="blue text"> Designmu! </span>
            </p>

            <div class="auth-fill">
                <div class="email"> 
                    <p class="auth-kinds">Email</p>                    
                    <input type="email" class="fill-here" placeholder="email@email.com">
                </div>
                <div class="fullname">
                    <p class="auth-kinds">Nama Lengkap</p>
                    <input type="text" class="fill-here" placeholder="Tuliskan Nama Lengkap">
                </div>
                <div class="password">
                    <p class="auth-kinds">Password</p>
                    <input type="password" class="fill-here" placeholder="Tuliskan Password">
                </div>
            </div>
            
            <div class="end-credit-scene"> 
                <div class="auth-button">
                    <button type="submit">Daftar</button>
                    <div class="login-link">
                        <span class="log-link">Sudah punya akun? <a href="/login.html">Login</a></span>
                    </div>
                </div>
            </div>
        </div> 
        </div>   
    </div>
    <div class="icon-left">
        <img src="/assets/icon_hijau.png" alt="Icon Hijau">
    </div>
    <div class="icon-right">
        <img src="/assets/icon_ungu.png" alt="Icon Ungu">
    </div>
    <div class="icon-pink">
        <img src="/assets/icon_pink.png" alt="Icon Pink">
    </div>
   
</body>
</html>
