<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Daftar </title>
    <link rel="stylesheet" href="daftar.css">
</head>
<body>
    <div class="auth-box">
        <div class="auth-main">
            <p> 
                <span class="pink text"> Yuk </span>
                <span class="green text"> Mulai </span>
                <span class="darkblue text"> Kelola </span>
                <span class="blue text"> Designmu! </span>
            </p>

            <div class="auth-fill">
                <div class="email"> 
                    <p class="auth-kinds"> Email</p>                    
                    <p class="fill-here"> email@email.com </p>
                </div>
                <div class="fullname">
                    <p class="auth-kinds"> Nama Lengkap </p>
                    <p class="fill-here"> Tuliskan Nama Lengkap </p>
                </div>
                <div class="password">
                    <p class="auth-kinds"> Password</p>
                    <p class="fill-here"> Tuliskan Password </p>
                </div>
            </div>
            
            <div class="end-credit-scene"> 
                <div class="auth-button">
                    <button type="submit">Daftar</button>
                    <div class="login-link">
                        <span class="log-link">Sudah punya akun? <a href="#">Login</a></span>
                    </div>
                </div>
                
            </div>

        </div> 

        

        </div>   
    </div>

</body>
</html>
