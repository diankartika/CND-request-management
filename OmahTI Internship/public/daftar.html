<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign Up </title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');

body{
    margin: 0;
    height: 100%;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: hidden;
}

/* kotak daftar */
.auth-box{
    width: 684px;
    height: 643px;
    background-color: #F5F5FF;
    margin : 50px 0 198px;
    display: flex;
    align-items: center;
    gap: 37px;
    border : 1px solid #8D8FF9;
    border-radius: 20px;
}
.auth-main{
    height: 499px;
    width: 569px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    padding : 72.5px 58px 65.5px 57px; 
    align-items: center;
}
.auth-main p{
    margin:0;
}
.text{
    font-family: Plus Jakarta Sans;
    font-weight: 700;
    font-size: 42px;
}
.pink{
    color: #E9509D;
}
.green{
    color : #50E9B6;
}
.darkblue{
    color : #4043E9
}
.blue{
    color:#6264F2
}
.auth-fill {
    height: 270px;
    width: 569px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}

/* Pastikan wrapper tidak membatasi lebar input */
.email, .fullname, .password {
    width: 100%;
    height: 70px;
}

/* Label untuk input */
.auth-kinds {
    margin: 0;
    padding-bottom: 6px;
    font-family: Inter;
    font-weight: 500;
    font-size: 14px;
    color: #011829;
}

/* Input element */
.fill-here {
    width: 100%;
    box-sizing: border-box;
    margin: 0;
    background-color: white;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #D4D4D8;
    font-family: Inter, sans-serif;
    font-weight: 400;
    font-size: 16px;
    color: #011829;
    outline: none;
    transition: border 0.2s ease, box-shadow 0.2s ease;
}

.auth-button{
    width: 301px;
    height: 80px;
    display: flex;
    justify-content: center;
    flex-direction: column;
    gap : 15px;
}

.end-credit-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
}

/* Button styling */
.auth-button button {
    width: 100%;
    height: 44px;
    border: 1px solid #6264F2;
    background-color: #6264F2;
    border-radius: 8px;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    cursor: pointer;
}

/* Login text container */
.auth-button .login-link {
    text-align: center;
    font-size: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

/* Text before the link */
.log-link {
    font-weight: 700;
    color: #000287;
}

/* Actual link */
.login-link a {
    color: #DD388B;
    font-weight: 400;
    text-decoration: none;
}
.icon-left, .icon-right, .icon-pink {
    position: absolute;
    z-index: -1;
}

.icon-left {
    top: 0; /* Di bawah navbar */
    left: -60.74px;
    width: 300px;
    z-index: -3;
}

.icon-right {
    top: -28px; /* Di bawah navbar */
    left: 1350px;
    width: 420px;
    z-index: -1;
}

.icon-pink {
    top: 192px; /* Di bawah navbar */
    left : 1400px;
    width: 453px;
    z-index: -2;
}

    </style>
</head>
<body>
    <div class="auth-box">
        <div class="auth-main">
            <p> 
                <span class="pink text"> Yuk </span>
                <span class="green text"> Mulai </span>
                <span class="darkblue text"> Kelola </span>
                <span class="blue text"> Designmu! </span>
            </p>

            <div class="auth-fill">
                <div class="email"> 
                    <p class="auth-kinds">Email</p>                    
                    <input type="email" class="fill-here" placeholder="email@email.com">
                </div>
                <div class="fullname">
                    <p class="auth-kinds">Nama Lengkap</p>
                    <input type="text" class="fill-here" placeholder="Tuliskan Nama Lengkap">
                </div>
                <div class="password">
                    <p class="auth-kinds">Password</p>
                    <input type="password" class="fill-here" placeholder="Tuliskan Password">
                </div>
            </div>
            
            <div class="end-credit-scene"> 
                <div class="auth-button">
                    <button type="submit">Daftar</button>
                    <div class="login-link">
                        <span class="log-link">Sudah punya akun? <a href="/login.html">Login</a></span>
                    </div>
                </div>
            </div>
        </div> 
        </div>   
    </div>
    <div class="icon-left">
        <img src="/assets/icon_hijau.png" alt="Icon Hijau">
    </div>
    <div class="icon-right">
        <img src="/assets/icon_ungu.png" alt="Icon Ungu">
    </div>
    <div class="icon-pink">
        <img src="/assets/icon_pink.png" alt="Icon Pink">
    </div>
   
</body>
</html>
