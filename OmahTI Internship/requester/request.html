<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 200px;
            background-color: #ffd1dc;
            height: 100vh;
            position: fixed;
            padding: 20px 0;
        }
        
        .profile {
            display: flex;
            align-items: center;
            padding: 0 15px;
            margin-bottom: 25px;
        }
        
        .profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .profile-name {
            color: #333;
            font-weight: 500;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        
        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        .menu-item .icon {
            margin-right: 10px;
            width: 24px;
            text-align: center;
        }
        
        .logout-btn {
            margin-top: auto;
            background-color: #a03256;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100px;
            font-weight: 500;
            margin-left: 15px;
            margin-bottom: 15px;
            position: absolute;
            bottom: 0;
        }
        
        .content {
            margin-left: 200px;
            padding: 20px;
            flex: 1;
        }
        
        .form-header {
            font-size: 24px;
            font-weight: 600;
            color: #3949ab;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .form-control::placeholder {
            color: #aaa;
        }
        
        .form-button {
            background-color: #1a237e;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="profile">
            <img src="/api/placeholder/40/40" alt="Profile">
            <span class="profile-name">Rafael Mahardika</span>
        </div>
        
        <div class="menu">
            <a href="#" class="menu-item">
                <span class="icon">🏠</span>
                <span>Home</span>
            </a>
            
            <a href="#" class="menu-item active">
                <span class="icon">📋</span>
                <span>Request</span>
            </a>
        </div>
        
        <button class="logout-btn">Log out</button>
    </div>
    
    <div class="content">
        <div class="form-header">Form Request</div>
        
        <div class="form-group">
            <label class="form-label">Judul Request</label>
            <input type="text" class="form-control" placeholder="Mau request apa?">
        </div>
        
        <div class="form-group">
            <label class="form-label">Divisi</label>
            <input type="text" class="form-control" placeholder="Dari divisi apa?">
        </div>
        
        <div class="form-group">
            <label class="form-label">Deadline</label>
            <input type="text" class="form-control" placeholder="DD/MM/YYYY">
        </div>
        
        <div class="form-group">
            <label class="form-label">File Lampiran</label>
            <button class="form-control" style="text-align: left; color: #666;">
                <span style="margin-right: 10px;">📎</span>Add file
            </button>
        </div>
        
        <button class="form-button">Submit</button>
    </div>
</body>
</html>
